<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Sitio - DevOps + Tienda</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header>
    <h1>🚀 Mi Sitio Web + 🛒 Tienda</h1>
  </header>

  <main>

    <!-- HERO -->
    <section class="hero">
      <h2>Bienvenido a DevOps</h2>
      <p>Este sitio está completamente automatizado</p>
      <button id="btn">Haz Clic</button>
    </section>

    <!-- FEATURES -->
    <section class="features">
      <h3>Características</h3>
      <article>
        <h4>✅ Validación Automática</h4>
        <p>GitHub valida el código</p>
      </article>
      <article>
        <h4>🚀 Deploy Automático</h4>
        <p>Cambios en vivo en minutos</p>
      </article>
    </section>

    <!-- TIENDA -->
    <section class="tienda">

      <div class="card">
        <h2>🛒 Productos</h2>
        <ul id="productos">
          <li>Cargando...</li>
        </ul>
      </div>

      <div class="card">
        <h2>📦 Categorías</h2>
        <ul id="categorias">
          <li>Cargando...</li>
        </ul>
      </div>

    </section>

  </main>

  <footer>
    <p>&copy; 2024 DevOps</p>
  </footer>

  <script src="script.js"></script>

</body>

</html>
